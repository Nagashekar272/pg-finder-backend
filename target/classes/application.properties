server.port=8080

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.pgfind=DEBUG

# Firebase Configuration
firebase.database.url=${FIREBASE_DATABASE_URL}

# OpenStreetMap / Overpass API Integration
# No API key needed! Completely free via openstreetmap.org
osm.sync.mock-mode=false

# Admin Credentials (set these in your environment or a .env file — never commit real values)
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.token.secret=${ADMIN_TOKEN_SECRET}
